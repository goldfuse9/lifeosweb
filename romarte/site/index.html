<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roman Arte – vývoj aplikací</title>
<meta name="description" content="Navrhuju a vyvíjím aplikace, které lidé pochopí bez návodu. LifeOS, Digitální školka a vývoj na zakázku.">
<meta name="theme-color" content="#F6F5F1">
<meta property="og:title" content="Roman Arte – vývoj aplikací">
<meta property="og:description" content="Aplikace, které lidé pochopí bez návodu.">
<meta property="og:image" content="img/skolka.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#17161A;--muted:#5F5D66;--bg:#F6F5F1;--lime:#D7F23A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--ink);text-decoration:none}

/* pozadí: tři pomalu plovoucí barevné skvrny */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(40px);opacity:.75;will-change:transform}
.bg i:nth-child(1){left:-18vmax;top:-22vmax;background:radial-gradient(circle,rgba(215,242,58,.55),transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.bg i:nth-child(2){right:-22vmax;top:8vmax;background:radial-gradient(circle,rgba(238,63,122,.30),transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
.bg i:nth-child(3){left:20vmax;bottom:-34vmax;background:radial-gradient(circle,rgba(155,110,240,.30),transparent 65%);animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-12vmax,14vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(-10vmax,-12vmax) scale(1.15)}}

.page{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;max-width:1120px;margin:0 auto;padding:24px clamp(20px,5vw,48px) 28px}

/* hlavička */
.top{display:flex;justify-content:space-between;align-items:center}
.mono{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:-.04em}
.link{position:relative;font-weight:700;font-size:15px;padding:12px 2px}
.link::after{content:"";position:absolute;left:2px;right:2px;bottom:8px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:right;transition:transform .35s ease}
.link:hover::after{transform:scaleX(1);transform-origin:left}

/* úvod */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,5vh,56px) 0}
.kicker{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--muted)}
.kicker::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(215,242,58,.8);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(160,190,20,.55)}80%,100%{box-shadow:0 0 0 12px rgba(160,190,20,0)}}
h1{margin:16px 0 0;font-size:clamp(64px,12vw,150px);line-height:.88;letter-spacing:-.065em;font-weight:800}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
h1 .w > span{display:inline-block;transform:translateY(105%);animation:rise 1s cubic-bezier(.2,1,.3,1) forwards}
h1 .w:nth-child(2) > span{animation-delay:.12s}
h1 .dot{color:var(--lime);-webkit-text-stroke:0}
@keyframes rise{to{transform:none}}
.lead{margin:28px 0 0;max-width:30em;font-size:clamp(18px,1.8vw,22px);line-height:1.5;color:var(--muted);opacity:0;animation:fade .9s ease .5s forwards}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* projekty — dva řádky */
.list{margin-top:clamp(28px,5vh,52px);border-top:1px solid rgba(23,22,26,.12)}
.row{position:relative;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:16px;padding:22px 4px;border-bottom:1px solid rgba(23,22,26,.12);opacity:0;animation:fade .8s ease forwards}
.row:nth-child(1){animation-delay:.7s}.row:nth-child(2){animation-delay:.82s}
.row .n{font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row b{display:block;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.035em;line-height:1.1;transition:transform .45s cubic-bezier(.2,1,.3,1)}
.row small{display:block;margin-top:4px;font-size:15px;color:var(--muted);transition:transform .45s cubic-bezier(.2,1,.3,1) .03s}
.row .arr{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(23,22,26,.15);transition:background .3s ease,transform .45s cubic-bezier(.2,1,.3,1),border-color .3s}
.row:hover b,.row:hover small{transform:translateX(10px)}
.row:hover .arr{background:var(--ink);border-color:var(--ink);color:#fff;transform:rotate(-45deg)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:12px}
/* náhled při najetí (jen s myší) */
.peek{position:absolute;right:88px;top:50%;width:150px;border-radius:18px;overflow:hidden;pointer-events:none;opacity:0;transform:translateY(-50%) scale(.85) rotate(-4deg);transition:opacity .3s ease,transform .45s cubic-bezier(.2,1,.3,1);box-shadow:0 24px 50px -18px rgba(23,22,26,.45)}
.peek img{display:block;width:100%}
.peek.tall{width:110px}
@media (hover:hover){.row:hover .peek{opacity:1;transform:translateY(-50%) scale(1) rotate(-4deg)}}
@media (max-width:640px){.peek{display:none}.row{grid-template-columns:32px 1fr auto}}

/* patička */
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-top:28px;opacity:0;animation:fade .8s ease 1s forwards}
.cta{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;transition:gap .25s ease,transform .25s ease}
.cta:hover{gap:16px;transform:translateY(-2px);color:#fff}
.meta{font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  h1 .w > span,.lead,.row,.foot{transform:none;opacity:1}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="page">
  <header class="top">
    <a class="mono" href="/" aria-label="Roman Arte">RA</a>
    <a class="link" href="mailto:[E-MAIL]">Napsat mi</a>
  </header>

  <main class="hero">
    <span class="kicker">Vývoj aplikací · volné kapacity</span>
    <h1><span class="w"><span>Roman</span></span><br><span class="w"><span>Arte<span class="dot">.</span></span></span></h1>
    <p class="lead">Navrhuju a vyvíjím mobilní a webové aplikace, které lidé pochopí bez návodu.</p>

    <nav class="list" aria-label="Projekty">
      <a class="row" href="https://lifeos.romarte.cz/">
        <span class="n">01</span>
        <span><b>LifeOS</b><small>Zdraví celé rodiny v telefonu</small></span>
        <span class="arr" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        <span class="peek tall" aria-hidden="true"><img src="img/lifeos.jpg" alt=""></span>
      </a>
      <a class="row" href="https://lifeds.romarte.cz/">
        <span class="n">02</span>
        <span><b>Digitální školka</b><small>Školka bez papírů</small></span>
        <span class="arr" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        <span class="peek" aria-hidden="true"><img src="img/skolka.jpg" alt=""></span>
      </a>
    </nav>
  </main>

  <footer class="foot">
    <a class="cta" href="mailto:[E-MAIL]">Pojďme spolupracovat
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <span class="meta">Roman Arte · IČO [IČO]</span>
  </footer>
</div>
</body>
</html>
