# Netlify (romarte.cz) nasazuje složku web/: rozcestník, stránka pro rodiny a pro školky.
# Starší testovací stránka s předobjednávkou zůstává v test-horecka/, ale nenasazuje se.
[build]
  publish = "web"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
