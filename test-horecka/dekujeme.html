<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS – děkujeme</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAFAF9">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF9}
a{color:#17161A}a:hover{color:#514F57}
@keyframes lf-in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes lf-check{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.lf-card{animation:lf-in .6s cubic-bezier(.2,1,.3,1) both}
.lf-ok{animation:lf-check .7s cubic-bezier(.2,1.5,.4,1) .2s both}
@media (prefers-reduced-motion:reduce){.lf-card,.lf-ok{animation:none!important}}
</style>
</head>
<body>
<div style="width:100%;min-height:100vh;box-sizing:border-box;background:#FAFAF9;color:#17161A;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="position:absolute;left:50%;top:-200px;transform:translateX(-50%);width:1000px;max-width:200%;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(215,242,58,.42),rgba(250,250,249,0) 62%);pointer-events:none"></div>

  <header style="position:relative;max-width:1200px;width:100%;box-sizing:border-box;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:center">
    <a href="./" style="display:flex;align-items:center;font-weight:800;font-size:24px;letter-spacing:-0.035em;text-decoration:none;min-height:44px">LifeOS</a>
  </header>

  <main style="position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:24px 24px 72px">
    <div class="lf-card" style="width:100%;max-width:520px;background:#FFFFFF;border:1px solid #EEEEEC;border-radius:40px;padding:48px 32px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;box-shadow:0 30px 70px -30px rgba(23,22,26,.28)">
      <span class="lf-ok" style="width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#D7F23A 0%,#C6E82E 50%,#E6F7A0 100%);box-shadow:0 18px 40px rgba(160,190,20,.38)">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </span>
      <h1 style="margin:0;font-size:clamp(30px,4vw,40px);line-height:1.05;letter-spacing:-0.04em;font-weight:800">Zaplaceno. Děkujeme!</h1>
      <p style="margin:0;font-size:17px;line-height:1.5;color:#514F57;max-width:26em">Máte předplacený první rok LifeOS za 649 Kč. Potvrzení o platbě vám přišlo e-mailem. Až aplikaci spustíme, pošleme vám přístup mezi prvními.</p>
      <a href="./" style="display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#17161A;color:#FFFFFF;font-weight:700;font-size:15px;text-decoration:none;margin-top:6px">Zpět na úvod</a>
    </div>
  </main>
</div>
</body>
</html>
